# Test Profile Properties
spring.datasource.url=jdbc:h2:mem:bharathire_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

bharathire.jwt.secret=test_jwt_secret_key_for_unit_and_integration_testing_only_1234567890
bharathire.jwt.expiration-ms=3600000
bharathire.upload.dir=./target/test-uploads
