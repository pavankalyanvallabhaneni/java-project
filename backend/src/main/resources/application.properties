spring.application.name=bharathire-backend

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# Default Profile: dev (H2 MySQL-compatibility mode with Flyway & pre-seeded realistic Indian jobs & users)
# Use 'mysql' profile when running with MySQL server or Docker compose
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA & Hibernate Defaults
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none

# File Upload Configuration
bharathire.upload.dir=${UPLOAD_DIR:./uploads/resumes}
bharathire.upload.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
bharathire.jwt.secret=${JWT_SECRET:bharathire_super_secret_jwt_key_2026_indian_recruitment_portal_security_key_xyz987}
bharathire.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Client URL for CORS
bharathire.client.url=${CLIENT_URL:http://localhost:5173}

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Timezone
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.date-format=dd-MM-yyyy HH:mm:ss
